monitor=HEADLESS-1,1920x1080@60,auto,1

exec-once = waybar
exec-once = dunst
exec-once = kitty

input {
    kb_layout = us
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 10
    blur = yes
    blur_size = 3
    blur_passes = 1
}

misc {
    disable_hyprland_logo = true
}